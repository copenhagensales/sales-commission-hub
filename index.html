    <!-- Farver til ældre TV-browsere (Chromium < 65) der ikke forstår "hsl(H S% L% / a)": omskriver reglerne til hsla(H, S, L, a). Ingen effekt i nye browsere. -->
    <script>
      (function () {
        if (!window.CSS || !CSS.supports || CSS.supports("color", "hsl(1 2% 3% / 0.5)")) return;
        var done = [];
        function rootVars() {
          var cs = getComputedStyle(document.documentElement), out = {};
          for (var i = 0; i < cs.length; i++) { var n = cs[i]; if (n.indexOf("--") === 0) out[n] = cs.getPropertyValue(n).trim(); }
          return out;
        }
        function conv(text, vars) {
          return text.replace(/hsl\(\s*var\((--[\w-]+)\)\s*(?:\/\s*([\d.]+%?|var\(--[\w-]+\)))?\s*\)/g, function (m, name, a) {
            var v = vars[name]; if (!v) return m;
            var p = v.split(/\s+/); if (p.length < 3) return m;
            var alpha = a ? (a.indexOf("var(") === 0 ? (vars[a.slice(4, -1)] || "1") : a) : "1";
            if (alpha.indexOf("%") > 0) alpha = parseFloat(alpha) / 100;
            return "hsla(" + p[0] + ", " + p[1] + ", " + p[2] + ", " + alpha + ")";
          }).replace(/hsl\(([\d.]+)\s+([\d.]+%)\s+([\d.]+%)\s*(?:\/\s*([\d.]+%?))?\)/g, function (m, h, s, l, a) {
            var alpha = a ? (a.indexOf("%") > 0 ? parseFloat(a) / 100 : a) : 1;
            return "hsla(" + h + ", " + s + ", " + l + ", " + alpha + ")";
          });
        }
        function fix() {
          var vars = rootVars(), css = "";
          for (var i = 0; i < document.styleSheets.length; i++) {
            var sh = document.styleSheets[i];
            if (done.indexOf(sh) >= 0 || (sh.ownerNode && sh.ownerNode.id === "legacy-hsl")) continue;
            var rules; try { rules = sh.cssRules; } catch (e) { continue; }
            if (!rules) continue;
            done.push(sh);
            for (var j = 0; j < rules.length; j++) {
              var t = rules[j].cssText;
              if (t.indexOf("hsl(") >= 0) css += conv(t, vars) + "\n";
            }
          }
          if (!css) return;
          var el = document.createElement("style"); el.id = "legacy-hsl-" + done.length;
          el.textContent = css; document.head.appendChild(el); done.push(el.sheet);
        }
        document.addEventListener("DOMContentLoaded", fix);
        window.addEventListener("load", fix);
        setTimeout(fix, 3000);
      })();
    </script>
    <!-- Minimal AbortController-polyfill til ældre TV-browsere (Chromium < 66, fx Samsung Tizen). Ingen effekt i nye browsere. -->
    <script>
      (function () {
        if (typeof window.AbortController === "function") return;
        function Sig() { this.aborted = false; this.reason = undefined; this.onabort = null; this._l = []; }
        Sig.prototype.addEventListener = function (t, fn) { if (t === "abort") this._l.push(fn); };
        Sig.prototype.removeEventListener = function (t, fn) { this._l = this._l.filter(function (f) { return f !== fn; }); };
        Sig.prototype.dispatchEvent = function () { return true; };
        Sig.prototype.throwIfAborted = function () { if (this.aborted) throw this.reason; };
        function AC() { this.signal = new Sig(); }
        AC.prototype.abort = function (reason) {
          var s = this.signal; if (s.aborted) return;
          s.aborted = true; s.reason = reason !== undefined ? reason : new Error("Aborted");
          var ev = { type: "abort", target: s };
          if (typeof s.onabort === "function") s.onabort(ev);
          s._l.slice().forEach(function (fn) { fn(ev); });
        };
        window.AbortController = AC;
        window.AbortSignal = Sig;
      })();
    </script>
