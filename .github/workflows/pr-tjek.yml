name: PR-tjek

# Kører på hver pull request: installerer med Lovables lockfil (bun.lock), typechecker og bygger. Lint rapporteres, men
# blokerer ikke endnu (main har eksisterende lint-fejl). Ingen hemmeligheder, ingen adgang til databasen.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-tjek-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tjek:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Installér (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Byg
        run: bun run build
      - name: Lint (rapporterende)
        continue-on-error: true
        run: bun run lint
