<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2e3136" />
<title>Stork – ingen forbindelse</title>
<style>
  html,body{margin:0;height:100%;background:#e6f0f1;color:#2e3136;font-family:Figtree,system-ui,sans-serif}
  main{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
  .card{background:#fff;border-radius:24px;padding:32px;max-width:360px;text-align:center}
  .mark{width:64px;height:64px;border-radius:16px;background:#2e3136;color:#3be086;font-weight:800;font-size:40px;line-height:64px;margin:0 auto 16px}
  h1{font-size:20px;margin:0 0 8px;font-weight:800}
  p{margin:0 0 20px;color:#59606a;font-size:15px;line-height:1.5}
  button{background:#2e3136;color:#e6f0f1;border:0;border-radius:999px;padding:12px 24px;font-size:15px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<main><div class="card">
  <div class="mark" aria-hidden="true">S</div>
  <h1>Stork kræver internetforbindelse</h1>
  <p>Dine tal hentes altid live. Tjek din forbindelse, og prøv igen.</p>
  <button type="button" onclick="location.reload()">Prøv igen</button>
</div></main>
</body>
</html>
