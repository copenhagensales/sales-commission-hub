<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV videotest</title>
<style>
  body { margin: 0; padding: 16px 24px; background: #111; color: #eee; font: 18px/1.4 sans-serif; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  #info { font-size: 18px; color: #bbb; margin-bottom: 16px; word-break: break-all; }
  .grid { display: grid; grid-template-columns: repeat(4, 340px); gap: 20px; }
  .cell { background: #1c1c1c; padding: 10px; border-radius: 8px; }
  .label { font-size: 32px; font-weight: bold; margin-bottom: 4px; }
  video { width: 320px; height: 180px; background: #000; display: block; border: 1px solid #444; }
  .status { font-size: 18px; margin-top: 8px; min-height: 130px; white-space: pre-line; }
  .ok { color: #3f3; font-weight: bold; font-size: 22px; }
  .bad { color: #f44; font-weight: bold; font-size: 22px; }
  button { margin-top: 8px; width: 100%; font-size: 22px; padding: 14px; background: #333; color: #fff; border: 3px solid #555; border-radius: 8px; }
  button:focus { outline: 4px solid #ff0; border-color: #ff0; background: #444; }
</style>
</head>
<body>
<h1>TV videotest</h1>
<div id="info"></div>
<div class="grid" id="grid"></div>
<script>
(function () {
  var videos = [
    { id: "A", src: "/tv/test/a-h264-base-noaudio.mp4", type: 'video/mp4; codecs="avc1.42E01E"' },
    { id: "B", src: "/tv/test/b-h264-main-aac.mp4", type: 'video/mp4; codecs="avc1.4D401F, mp4a.40.2"' },
    { id: "C", src: "/tv/test/c-vp9.webm", type: 'video/webm; codecs="vp9"' },
    { id: "D", src: "/tv/test/d-h264-high-720p-aac.mp4", type: 'video/mp4; codecs="avc1.640028, mp4a.40.2"' }
  ];
  function info() {
    document.getElementById("info").textContent =
      "UA: " + navigator.userAgent + " | Vindue: " + window.innerWidth + "×" + window.innerHeight;
  }
  info(); window.addEventListener("resize", info);
  var grid = document.getElementById("grid");
  var items = videos.map(function (v) {
    var cell = document.createElement("div"); cell.className = "cell";
    var label = document.createElement("div"); label.className = "label"; label.textContent = v.id;
    var el = document.createElement("video");
    el.muted = true; el.loop = true; el.autoplay = true; el.playsInline = true; el.preload = "auto";
    el.setAttribute("muted", ""); el.setAttribute("loop", ""); el.setAttribute("autoplay", "");
    el.setAttribute("playsinline", ""); el.setAttribute("webkit-playsinline", ""); el.setAttribute("preload", "auto");
    var s = document.createElement("source"); s.src = v.src; s.type = v.type.split(";")[0]; el.appendChild(s);
    var status = document.createElement("div"); status.className = "status";
    var btn = document.createElement("button"); btn.type = "button"; btn.textContent = "Fuld skærm " + v.id;
    btn.addEventListener("click", function () {
      try {
        var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitEnterFullscreen;
        if (fn) { var p = fn.call(el); if (p && p.catch) p.catch(function () {}); }
      } catch (e) {}
    });
    cell.appendChild(label); cell.appendChild(el); cell.appendChild(status); cell.appendChild(btn);
    grid.appendChild(cell);
    return { v: v, el: el, status: status, btn: btn, last: -1 };
  });
  function tryPlay(it) {
    if (it.el.paused && !it.el.error) {
      try { var p = it.el.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
    }
  }
  window.addEventListener("load", function () { items.forEach(tryPlay); });
  setInterval(function () { items.forEach(tryPlay); }, 5000);
  setInterval(function () {
    items.forEach(function (it) {
      var el = it.el, t = el.currentTime;
      var works = !el.paused && t > it.last && it.last >= 0;
      it.last = t;
      var cpt = "";
      try { cpt = el.canPlayType(it.v.type) || "(tom)"; } catch (e) { cpt = "fejl"; }
      it.status.innerHTML = "";
      var head = document.createElement("div");
      head.className = works ? "ok" : "bad";
      head.textContent = works ? "VIRKER" : "VIRKER IKKE";
      var body = document.createElement("div");
      body.textContent =
        "paused: " + el.paused + "\ncurrentTime: " + t.toFixed(1) +
        "\nreadyState: " + el.readyState + "\nvideo: " + el.videoWidth + "×" + el.videoHeight +
        "\nerror: " + (el.error ? el.error.code : "ingen") + "\ncanPlayType: " + cpt;
      it.status.appendChild(head); it.status.appendChild(body);
    });
  }, 1000);
  // Piletaster flytter fokus mellem knapperne
  document.addEventListener("keydown", function (e) {
    var idx = items.findIndex(function (it) { return it.btn === document.activeElement; });
    if (e.key === "ArrowRight" || e.keyCode === 39) { idx = Math.min(items.length - 1, idx + 1); }
    else if (e.key === "ArrowLeft" || e.keyCode === 37) { idx = Math.max(0, idx - 1); }
    else if ((e.key === "ArrowDown" || e.key === "ArrowUp" || e.keyCode === 40 || e.keyCode === 38) && idx < 0) { idx = 0; }
    else return;
    if (idx < 0) idx = 0;
    items[idx].btn.focus(); e.preventDefault();
  });
  items[0].btn.focus();
})();
</script>
</body>
</html>
